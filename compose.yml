services:
  # Nginx Reverse Proxy
  rp:
    image: nginx:1.31.7@sha256:6c3fee1d7a4686ea271e9cc60d9c741cdfbc44ecf11d343025e1cff4c5522f47
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - th
    restart: unless-stopped

  th:
    image: ghcr.io/baipyrus/terminal-homepage:main
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: 'production'
    restart: unless-stopped
