services:
  # Nginx Reverse Proxy
  rp:
    image: nginx:1.31.4@sha256:b34848eff6db786b6b1282d3a9c3fd0b5563dfb6d261df4923378b419e0d24f0
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - th
    restart: unless-stopped

  th:
    image: ghcr.io/baipyrus/terminal-homepage:main
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: 'production'
    restart: unless-stopped
