services:
  # Nginx Reverse Proxy
  rp:
    image: nginx:1.31.6@sha256:63a925a5a2927ec6415e39390b2f6041407c92b70f22b2c9ba71b797d6881d81
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - th
    restart: unless-stopped

  th:
    image: ghcr.io/baipyrus/terminal-homepage:main
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: 'production'
    restart: unless-stopped
